[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-azure-sql-migrator"
version = "0.1.0"
description = "Orchestrate SQL Server migrations from AWS to Azure SQL"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34,<2",
  "azure-identity>=1.17,<2",
  "pyodbc>=5.1,<6",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.2,<9"]

[project.scripts]
aws-azure-sql-migrate = "migration_tool.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["migration_tool*"]
